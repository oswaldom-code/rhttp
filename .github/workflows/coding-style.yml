name: Coding Style

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  style:
    name: gofmt + golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and kept in sync with install-tools in the Makefile, so the
          # linter that runs locally is the one CI runs.
          version: v2.14.0
          args: --timeout=5m
