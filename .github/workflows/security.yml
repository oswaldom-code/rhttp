name: Security

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.mod

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          # G404: backoff jitter uses math/rand on purpose. It spreads retry
          # timing across clients and has no security role, so crypto/rand
          # would only add cost.
          gosec -quiet -exclude-generated \
            -exclude=G404 \
            -exclude-dir=benchmarks -exclude-dir=examples \
            ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The stdlib is the only dependency, so findings track the toolchain
      # itself. Always scan with the newest stable Go to avoid reporting
      # CVEs already fixed in a patch release.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan Go sources
        # math-random-used: same rationale as gosec G404 above.
        run: semgrep scan --config p/golang --error --quiet --exclude='.github' --exclude-rule go.lang.security.audit.crypto.math_random.math-random-used

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # benchmarks/ is a separate, unpublished module of comparison clients.
          skip-dirs: benchmarks
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
