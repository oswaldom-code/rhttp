run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose        # Check HTTP response body is closed
    - dupl             # Code duplication
    - gocognit         # Cognitive complexity
    - goconst          # Repeated strings that could be constants
    - gocritic         # Opinionated linter
    - gocyclo          # Cyclomatic complexity
    - gofmt            # Formatting
    - goimports        # Import formatting
    - gosec            # Security issues
    - misspell         # Spelling mistakes
    - nakedret         # Naked returns in functions
    - prealloc         # Slice preallocation
    - revive           # Fast, configurable linter
    - unconvert        # Unnecessary type conversions
    - unparam          # Unused function parameters
    - whitespace       # Whitespace issues

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - io.Copy
      - io.ReadAll
      - (io.Closer).Close

  gocognit:
    min-complexity: 20

  gocyclo:
    min-complexity: 15

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - hugeParam
      - whyNoLint
      - commentedOutCode

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/oswaldom-code/rhttp

  gosec:
    excludes:
      - G104  # Audit errors not checked (we handle this with errcheck)
      - G304  # File path provided as taint input (not applicable for HTTP client)

  misspell:
    locale: US

  nakedret:
    max-func-lines: 30

  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  unparam:
    check-exported: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gocognit
        - gocyclo
        - gosec
        - unparam
        - errcheck    # Test code commonly ignores errors
        - bodyclose   # Test roundtrippers often return mock responses
        - goconst     # Test strings don't need to be constants

    # Exclude revive unused-parameter in test files
    - path: _test\.go
      text: "unused-parameter"
      linters:
        - revive

    # Allow complexity in internal roundtripper
    - path: internal/
      linters:
        - gocognit
        - gocyclo

    # Exclude unused functions that are part of the pool API
    - path: pool\.go
      text: "func `acquireResponse` is unused"
      linters:
        - unused

  max-issues-per-linter: 50
  max-same-issues: 10
  new: false

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
